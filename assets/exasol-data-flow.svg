<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title"><title id="title">Inspection and review to Exasol to quality analytics</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60d8b0"/></marker></defs><rect width="1200" height="310" rx="16" fill="#0f1e2c"/><g font-family="Arial,sans-serif"><text x="35" y="42" fill="#8caabd" font-size="14" letter-spacing="2">FROM LOCAL EVIDENCE TO SQL-BACKED QUALITY DECISIONS</text><g fill="#193243" stroke="#35556a"><rect x="35" y="89" width="235" height="150" rx="12"/><rect x="330" y="89" width="235" height="150" rx="12"/><rect x="625" y="89" width="235" height="150" rx="12"/><rect x="920" y="89" width="245" height="150" rx="12"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="57" y="129">Inspect &amp; review</text><text x="352" y="129">Journal &amp; retry</text><text x="647" y="129">Exasol Personal</text><text x="942" y="129">Quality analytics</text></g><g fill="#bad0dd" font-size="16"><text x="57" y="167">Original visual evidence</text><text x="57" y="196">Inspector disposition</text><text x="352" y="167">Durable local delivery</text><text x="352" y="196">Explicit pending status</text><text x="647" y="167">Evidence + review views</text><text x="647" y="196">Source-filtered SQL</text><text x="942" y="167">Batch / machine / day</text><text x="942" y="196">Descriptive risk &amp; trends</text></g><g stroke="#60d8b0" stroke-width="3" marker-end="url(#arrow)"><path d="M276 165H320"/><path d="M571 165H615"/><path d="M866 165H910"/></g><text x="35" y="279" font-size="15" fill="#8caabd">Real and synthetic sources stay separate. Original evidence is retained after human review.</text></g></svg>