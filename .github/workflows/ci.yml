name: Validate application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'backend/*.txt'
      - name: Install analytics and inspection base
        run: python -m pip install -r backend/requirements-base.txt -r backend/requirements-exasol.txt -c backend/constraints-validated.txt
      - name: Install OpenCV system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - name: Check dependencies
        run: python -m pip check
      - name: Run offline regression suite
        run: python -m pytest backend/tests -q
      - name: Preview deterministic demo
        run: python scripts/seed_demo_data.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm exec tsc -- --noEmit
